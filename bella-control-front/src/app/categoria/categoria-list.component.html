<div class="container">
  <h2>Categorias</h2>
  <div class="actions">
    <button (click)="novo()">Nova Categoria</button>
  </div>

  <div *ngIf="loading">Carregando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && categorias.length">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Descrição</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of categorias">
        <td>{{ c.id }}</td>
        <td>{{ c.nome }}</td>
        <td>{{ c.descricao }}</td>
        <td>
          <button (click)="detalhes(c.id)">Ver</button>
          <button (click)="editar(c.id)">Editar</button>
          <button (click)="deletar(c.id)">Deletar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && categorias.length === 0">Nenhuma categoria encontrada.</div>
</div>
